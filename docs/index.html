<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鉄道駅 発着本数 3D</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }
    #control {
      position: absolute; z-index: 1; top: 20px; left: 20px; width: 270px;
      padding: 16px 18px; border-radius: 10px; background: rgba(255, 255, 255, .94);
      box-shadow: 0 3px 18px rgba(0, 0, 0, .24);
    }
    #control h1 { margin: 0 0 6px; font-size: 18px; }
    #time { margin-bottom: 5px; font-size: 15px; font-weight: 700; }
    #distance { margin: 0 0 12px; color: #555; font-size: 12px; line-height: 1.5; }
    input[type="range"] { width: 100%; accent-color: #e4572e; }
    #legend { margin-top: 14px; padding-top: 12px; border-top: 1px solid #ddd; font-size: 12px; }
    #legend-title { margin-bottom: 7px; font-weight: 700; }
    .legend-ramp {
      height: 12px; border: 1px solid rgba(80, 40, 20, .4); border-radius: 3px;
      background: linear-gradient(to right, #68bce8, #80c76a, #f1d54a, #ef8532, #c42e2e);
    }
    .legend-ticks { display: flex; justify-content: space-between; margin-top: 4px; color: #444; font-size: 11px; }
    #loading {
      position: absolute; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 12px 18px; background: white; border-radius: 7px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .2);
    }
  </style>
</head>
<body>
  <aside id="control">
    <h1>鉄道駅 発着本数</h1>
    <div id="time">徒歩 10 分圏</div>
    <p id="distance">円柱の半径: 約 800 m</p>
    <input id="slider" type="range" min="1" max="30" value="10" step="1" aria-label="徒歩圏の時間（分）">
    <div id="legend" aria-label="発着本数の凡例">
      <div id="legend-title">発着本数（円柱の色）</div>
      <div class="legend-ramp"></div>
      <div class="legend-ticks"><span>0</span><span>250</span><span>500</span><span>750</span><span>1,000本+</span></div>
    </div>
  </aside>
  <div id="loading">駅データを読み込んでいます…</div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <!-- MapLibre に重ねる deck.gl。円柱の描画・半径指定は deck.gl が担う。 -->
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
  <script>
    const WALKING_SPEED_METERS_PER_MINUTE = 80;
    const HEIGHT_PER_TRAIN_METERS = 15;
    const TOKYO_CENTER = [139.7671, 35.6812]; // 東京駅
    const CENTRAL_TOKYO_RADIUS_METERS = 25000;
    const CENTRAL_TOKYO_HEIGHT_MULTIPLIER = 1.25;
    const map = new maplibregl.Map({
      container: "map",
      style: "https://raw.githubusercontent.com/mayuge/OpenSourceStyle/refs/heads/main/style.json",
      center: [139.807, 35.5493],
      zoom: 9,
      pitch: 55,
      bearing: -12,
      hash: true,
      antialias: true
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    let stations = [];
    let overlay;
    const slider = document.getElementById("slider");
    const timeLabel = document.getElementById("time");
    const distanceLabel = document.getElementById("distance");

    function totalTrains(properties) {
      return ["着数1", "発数1", "着数2", "発数2"]
        .reduce((sum, key) => sum + (Number(properties[key]) || 0), 0);
    }

    function columnColor(frequency) {
      const stops = [
        [0, [104, 188, 232]],
        [250, [128, 199, 106]],
        [500, [241, 213, 74]],
        [750, [239, 133, 50]],
        [1000, [196, 46, 46]]
      ];
      const value = Math.min(Math.max(frequency, 0), 1000);
      const upperIndex = stops.findIndex(([limit]) => value <= limit);
      const [startValue, startColor] = stops[Math.max(upperIndex - 1, 0)];
      const [endValue, endColor] = stops[upperIndex];
      const progress = startValue === endValue ? 0 : (value - startValue) / (endValue - startValue);
      return startColor.map((channel, index) => Math.round(channel + (endColor[index] - channel) * progress)).concat(95);
    }

    function isInCentralTokyo([longitude, latitude]) {
      const metersPerDegreeLatitude = 111320;
      const longitudeDistance = (longitude - TOKYO_CENTER[0]) * metersPerDegreeLatitude * Math.cos(TOKYO_CENTER[1] * Math.PI / 180);
      const latitudeDistance = (latitude - TOKYO_CENTER[1]) * metersPerDegreeLatitude;
      return Math.hypot(longitudeDistance, latitudeDistance) <= CENTRAL_TOKYO_RADIUS_METERS;
    }

    function columnHeight(station) {
      const baseHeight = Math.max(12, station.frequency * HEIGHT_PER_TRAIN_METERS);
      return isInCentralTokyo(station.position)
        ? baseHeight * CENTRAL_TOKYO_HEIGHT_MULTIPLIER
        : baseHeight;
    }

    function renderColumns() {
      if (!overlay) return;
      const minutes = Number(slider.value);
      const radius = minutes * WALKING_SPEED_METERS_PER_MINUTE;
      timeLabel.textContent = `徒歩 ${minutes} 分圏`;
      distanceLabel.textContent = `円柱の半径: 約 ${radius.toLocaleString()} m`;
      overlay.setProps({
        layers: [new deck.ColumnLayer({
          id: "train-frequency-columns",
          data: stations,
          diskResolution: 24,
          extruded: true,
          radius,
          getPosition: d => d.position,
          // 高さだけが運行本数を表す。徒歩圏スライダーでは変化しない。
          // 都心部は混雑の見やすさのため控えめに強調する。
          getElevation: d => columnHeight(d),
          getFillColor: d => columnColor(d.frequency),
          getLineColor: [120, 45, 20, 100],
          lineWidthMinPixels: 1,
          pickable: true,
          autoHighlight: true,
          material: { ambient: 0.35, diffuse: 0.65, shininess: 28, specularColor: [255, 255, 255] }
        })]
      });
    }

    map.on("load", () => {
      overlay = new deck.MapboxOverlay({
        interleaved: true,
        getTooltip: ({ object }) => object && ({
          html: `<b>${object.name}</b><br>発着本数: ${object.frequency.toLocaleString()} 本`,
          style: { backgroundColor: "#fff", color: "#222", fontSize: "12px" }
        })
      });
      map.addControl(overlay);
      renderColumns();
    });

    fetch("./unkohonsu2026_rosen_eki.geojson")
      .then(response => {
        if (!response.ok) throw new Error(`GeoJSON の読み込みに失敗しました (${response.status})`);
        return response.json();
      })
      .then(data => {
        stations = data.features
          .filter(feature => feature.geometry?.type?.toLowerCase() === "point")
          .map(feature => ({
            position: feature.geometry.coordinates.map(Number),
            name: feature.properties?.["駅名"] || "名称未設定の駅",
            frequency: totalTrains(feature.properties || {})
          }))
          .filter(station => station.position.length >= 2 && station.position.every(Number.isFinite));
        document.getElementById("loading").style.display = "none";
        renderColumns();
      })
      .catch(error => {
        console.error(error);
        document.getElementById("loading").textContent = "駅データを読み込めませんでした";
      });

    slider.addEventListener("input", renderColumns);
  </script>
</body>
</html>
